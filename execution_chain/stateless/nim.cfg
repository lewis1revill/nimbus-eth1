--cpu:riscv64
--os:any
--mm:arc
--stackTrace:off
cc:clang
--clib:m
--clib:gloss
--threads:off
-d:useMalloc

riscv64.any.clang.exe = "riscv64-unknown-elf-clang"
riscv64.any.clang.linkerexe = "riscv64-unknown-elf-clang"
riscv64.any.clang.linker = "-march=rv64ima -T riscv64ima_zisk_zkvm_linker_script.ld"
riscv64.any.clang.always = "-march=rv64ima -mcmodel=medany"
